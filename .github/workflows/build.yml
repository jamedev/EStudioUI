name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-chrome:
    name: Windows / native chrome regression
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build and exercise the isolated Win32 frame adapter
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          if not defined VSINSTALLDIR exit /b 1
          mkdir "%RUNNER_TEMP%\estudioui-native-chrome"
          pushd "%RUNNER_TEMP%\estudioui-native-chrome"
          cl.exe /nologo /std:c++20 /EHsc /utf-8 /W4 /MD /D_WIN32_WINNT=0x0A00 /I"%GITHUB_WORKSPACE%\include" /I"%GITHUB_WORKSPACE%\src" "%GITHUB_WORKSPACE%\tests\NativeWindowChromeTests.cpp" "%GITHUB_WORKSPACE%\src\NativeWindowChrome.cpp" "%GITHUB_WORKSPACE%\src\NativeResizePump.cpp" /Fe:EStudioUINativeChromeTests.exe /link comctl32.lib dwmapi.lib shell32.lib user32.lib gdi32.lib
          if errorlevel 1 exit /b %errorlevel%
          EStudioUINativeChromeTests.exe
          if errorlevel 1 exit /b %errorlevel%
          rem Public model/view sources must compile independently of GLFW/GL and vcpkg headers.
          for %%f in (src/ModelValue.cpp src/ModelQuery.cpp src/ModelAdapter.cpp src/ModelEditSession.cpp src/SnapshotModelAdapter.cpp src/AdapterModel.cpp src/ItemModel.cpp src/SortFilterModel.cpp src/ItemDelegate.cpp src/CellEditor.cpp src/ItemDragDrop.cpp src/TreeTable.cpp src/TableWidget.cpp src/ListWidget.cpp src/TreeWidget.cpp browser/DatabaseBrowserWindow.cpp browser/Verification.cpp browser/main.cpp) do (
            cl.exe /nologo /Zs /std:c++20 /EHsc /utf-8 /W4 /MD /I"%GITHUB_WORKSPACE%\include" /I"%GITHUB_WORKSPACE%\src" /I"%GITHUB_WORKSPACE%\browser" "%GITHUB_WORKSPACE%\%%f"
            if errorlevel 1 exit /b 1
          )
          exit /b %errorlevel%

  windows:
    name: Windows / MSVC 2022 / x64-windows-estudioui
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      ESTUDIOUI_NATIVE_PLATFORM_TESTS: 1
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.tools/vcpkg-binary-cache
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: windows-v143-${{ hashFiles('vcpkg.json', 'vcpkg-bootstrap.json', 'vcpkg-configuration.json', 'cmake/ports/**', 'cmake/triplets/*.cmake') }}-${{ github.sha }}
          restore-keys: |
            windows-v143-${{ hashFiles('vcpkg.json', 'vcpkg-bootstrap.json', 'vcpkg-configuration.json', 'cmake/ports/**', 'cmake/triplets/*.cmake') }}-
            windows-v143-
      - name: Parse build scripts with PowerShell 7
        shell: pwsh
        run: |
          foreach ($path in @('Build.ps1', 'scripts/Profile-Rendering.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Install, build, and test Release
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path $env:VCPKG_DEFAULT_BINARY_CACHE -Force | Out-Null
          $checkout = Join-Path $env:RUNNER_TEMP 'estudioui-vcpkg'
          ./Build.ps1 -VcpkgRoot $checkout -Configuration Release -SkipGpuTest
      - name: Run native Windows framebuffer integration with software OpenGL
        shell: powershell
        timeout-minutes: 5
        run: |
          # Mesa is isolated beside a staged demo, never installed system-wide or shipped with the framework.
          $archive = Join-Path $env:RUNNER_TEMP 'mesa3d-26.2.4-release-msvc.7z'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z' -OutFile $archive
          $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($digest -ne '351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695') { throw 'Mesa archive checksum mismatch.' }
          $mesa = Join-Path $env:RUNNER_TEMP 'estudioui-ci-mesa'
          & 7z x $archive "-o$mesa" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract the pinned Mesa runtime.' }
          $driver = Get-ChildItem -LiteralPath $mesa -Filter opengl32.dll -Recurse | Where-Object { $_.Directory.Name -eq 'x64' } | Select-Object -First 1
          if (-not $driver) { throw 'Mesa x64 OpenGL runtime is missing.' }
          $stage = Join-Path $env:RUNNER_TEMP 'estudioui-native-gpu'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item 'build/windows-vcpkg/Release/*' $stage -Recurse -Force
          Copy-Item (Join-Path $driver.Directory.FullName '*.dll') $stage -Force
          $env:GALLIUM_DRIVER = 'llvmpipe'
          $env:LIBGL_ALWAYS_SOFTWARE = '1'
          & (Join-Path $stage 'EStudioUIDemo.exe') --self-test --output 'build/windows-vcpkg/verification/native-software-gl'
          if ($LASTEXITCODE -ne 0) { throw "Native Windows framebuffer self-test failed with exit code $LASTEXITCODE." }
          & (Join-Path $stage 'EStudioUICreator.exe') --self-test --output 'build/windows-vcpkg/verification/native-creator'
          if ($LASTEXITCODE -ne 0) { throw "Native Creator framebuffer self-test failed with exit code $LASTEXITCODE." }
          & (Join-Path $stage 'EStudioUIDatabaseBrowser.exe') --self-test --output 'build/windows-vcpkg/verification/native-database-browser'
          if ($LASTEXITCODE -ne 0) { throw "Native database browser framebuffer self-test failed with exit code $LASTEXITCODE." }
          ./scripts/Profile-Rendering.ps1 -SkipBuild -ExecutablePath (Join-Path $stage 'EStudioUIDemo.exe') -Frames 12 -Warmup 4 -Rate 0 -OutputDirectory 'build/windows-vcpkg/verification/native-profile-smoke'
          if ($LASTEXITCODE -ne 0) { throw "Native rendering profile smoke failed with exit code $LASTEXITCODE." }
      - name: Build and test Debug
        shell: powershell
        run: |
          $checkout = Join-Path $env:RUNNER_TEMP 'estudioui-vcpkg'
          ./Build.ps1 -VcpkgRoot $checkout -Configuration Debug -SkipGpuTest
      - name: Repeat native Debug lifecycle probes
        shell: powershell
        run: |
          # Recheck native STA cancellation/COM teardown after both complete suites.
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            ./build/windows-vcpkg/Debug/EStudioUINativePlatformTests.exe
            if ($LASTEXITCODE -ne 0) { throw "Native Debug repetition $attempt failed with exit code $LASTEXITCODE." }
          }
        # These checks use actual Win32 windows/WGL and Mesa rendering; hardware performance stays a separate gate.

  linux:
    name: Linux / vcpkg / software OpenGL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.tools/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.tools/vcpkg-binary-cache
      VCPKG_MAX_CONCURRENCY: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: linux-${{ hashFiles('vcpkg.json', 'vcpkg-bootstrap.json', 'vcpkg-configuration.json', 'cmake/ports/**') }}-${{ github.sha }}
          restore-keys: |
            linux-${{ hashFiles('vcpkg.json', 'vcpkg-bootstrap.json', 'vcpkg-configuration.json', 'cmake/ports/**') }}-
            linux-
      - name: Install system headers and bootstrap vcpkg
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config curl zip unzip tar xorg-dev libgl1-mesa-dev libosmesa6
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          revision="$(python3 -c "import json; print(json.load(open('vcpkg-bootstrap.json'))['commit'])")"
          git clone --no-checkout https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout --detach "$revision"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Build and run core and real GL framebuffer tests
        run: ./scripts/Build-Linux.sh Release
      - name: Build and run isolated CPU ThreadSanitizer checks
        run: |
          cmake -S . -B build/linux-thread-sanitizer -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DESTUDIOUI_BUILD_THREAD_TESTS=ON
          cmake --build build/linux-thread-sanitizer --parallel 2
          ctest --test-dir build/linux-thread-sanitizer --output-on-failure --no-tests=error
